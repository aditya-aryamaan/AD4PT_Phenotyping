# BoT-SORT uses the existing detector; no extra recognition model is loaded.
tracker_type: botsort
# AD4PT binds high/new thresholds to confidence_threshold in the model config.
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: false
model: auto
# AD4PT count confirmation, ignored by the Ultralytics tracker itself.
confirmation_frames: 3
